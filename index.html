<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chanana</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- Google Fonts for Open Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* General styles */
        body {
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #2c3e50; /* Dark background */
            position: relative;
            overflow: hidden;
            transition: background 0.2s ease; /* Smooth gradient update */
        }
    </style>
</head>
<body>
    <div>
        <h1 style="color: white; font-size: 36px;">Chanana.de</h1>
    </div>

    <script>
        document.addEventListener('mousemove', (event) => {
            const x = event.clientX / window.innerWidth;
            const y = event.clientY / window.innerHeight;
            // Creating a smoother background gradient
            document.body.style.background = `radial-gradient(circle at ${x * 100}% ${y * 100}%, #2980b9, #34495e)`;
        });
    </script>
</body>
</html>
